name: Hosted unit CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: hosted-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# WARNING: THIS REPOSITORY IS PUBLIC.
# Workflow logs here are world-readable. This job runs only unit tests, path
# hygiene, style tokens, a production build, and bundle-parity. It must never
# run live e2e, load model/API secrets, or print vault/note content.
jobs:
  validate:
    name: GitHub-hosted Ubuntu / unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Path hygiene
        run: npm run check:path-hygiene

      - name: Style tokens
        run: npm run check:style-tokens

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Bundle parity
        run: npm run check:bundle-parity
